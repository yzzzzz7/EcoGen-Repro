[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecogen-repro"
version = "0.1.0"
description = "Input and sample provenance gates for research pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
keywords = ["reproducibility", "genomics", "provenance", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
ecogen-repro = "ecogen_repro.cli:main"

[tool.setuptools.packages.find]
include = ["ecogen_repro*"]
