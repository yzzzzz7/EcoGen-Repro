name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: ecogen-repro --version
      - name: Exercise the installed package outside the source directory
        working-directory: qa
        run: ecogen-repro demo --out installed-demo
      - name: Verify the installed demo receipt
        working-directory: qa
        run: ecogen-repro verify installed-demo/receipt.json
      - name: Export a report with the installed command
        working-directory: qa
        run: ecogen-repro report installed-demo/receipt.json --out installed-report.html
